<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>窗贯验 · 潮切</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <aside class="侧轨">
      <div class="侧牌">潮切</div>
      <div class="侧副">物流网点轨迹 · 事件时关窗管道<br/>不是双轨对拍，也不是开腿成对</div>
      <div class="窗条" id="侧窗条">
        <div class="标">当前窗</div>
        <div class="号" id="侧窗号">加载中</div>
        <div class="时" id="侧窗时">—</div>
      </div>
      <div class="时轴">
        <div class="点"><b>装载</b>观测点入流</div>
        <div class="点"><b>入窗</b>事件时进缓冲</div>
        <div class="点"><b>关窗</b>物化切片账</div>
        <div class="点"><b>贯验</b>缓冲↔切片互证</div>
      </div>
      
      <nav class="侧链">
        <a href="/" >潮切台</a>
        <a href="/观测流.html" >观测流</a>
        <a href="/入窗缓冲.html" >入窗缓冲</a>
        <a href="/窗切片账.html" >窗切片账</a>
        <a href="/迟到匣.html" >迟到匣</a>
        <a href="/窗贯验.html" class="亮">窗贯验</a>
        <a href="/网点源.html" >网点源</a>
        <a href="/窗规.html" >窗规</a>
      </nav>

    </aside>
    <main class="主区">
      <header class="页头">
        <h1>窗贯验</h1>
        <p>已物化缓冲事件数必须等于切片账事件数之和；对不齐就是撕裂。</p>
      </header>

      <section class="卷" id="写闸贯验卡" data-testid="贯验写闸卡片">
        <h2>写闸贯验卡片</h2>
        <div id="闸卡"><p class="说明条">写闸状态加载中…</p></div>
      </section>
      <section class="卷">
        <div class="工具"><button class="按钮" id="跑">跑窗贯验</button> <span id="果"></span></div>
        <div class="表绕"><table><thead><tr><th>时刻</th><th>缓冲笔数</th><th>切片笔数</th><th>迟到笔数</th><th>是否对齐</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
      </section>
      <section class="卷"><p class="说明">贯验只认事件数互证，不认墙钟快慢。</p></section>
      <script>
      async function 刷写闸卡(验报) {
        const g = await 潮切.getJSON("/api/写闸");
        const errs = (验报 && 验报["写闸错误"]) || [];
        const errHtml = errs.length
          ? `<p class="说明" style="color:var(--危,#c0392b)">${errs.map(潮切.安全文本).join("<br/>")}</p>`
          : `<p class="说明">无封印窗偷渡现行缓冲。</p>`;
        const fp = 验报 && 验报["切片集指纹"] ? ` · 切片集指纹 ${验报["切片集指纹"]}` : "";
        const next = 验报
          ? "复验动作：封后再灌一次，再跑贯验；切片集指纹应保持不变"
          : "下一步：先跑一次窗贯验，卡片会列出写闸错误与切片集指纹";
        document.getElementById("闸卡").innerHTML =
          `<div class="工具"><span class="徽章 ${g["封印态"] === "已封印" ? "危" : "好"}">${潮切.安全文本(g["封印态"])}</span>
           <span class="徽章">${潮切.安全文本(g["策略"])}</span>
           <span class="徽章 ${g["valid"] ? "好" : "危"}">valid=${g["valid"] ? "true" : "false"}</span>
           ${验报 ? 潮切.徽章(验报["是否对齐"] ? "贯验对齐" : "贯验撕裂", 验报["是否对齐"] ? "好" : "危") : ""}</div>
           <p class="说明" data-testid="贯验写闸详情">窗号 <b>${潮切.安全文本(g["窗号"])}</b> · 拒因/归档键：${潮切.安全文本(g["拒因"] || g["归档键"] || "—")}${fp}<br><b>${next}</b></p>${errHtml}`;
      }
      async function 刷() {
        const rows = await 潮切.getJSON("/api/窗贯验");
        const tb = document.getElementById("表"); tb.innerHTML = "";
        for (const r of rows) {
          const ok = r.是否对齐 ? 潮切.徽章("对齐","好") : 潮切.徽章("撕裂","危");
          tb.appendChild(潮切.行(`<td>${潮切.安全文本(r.时刻)}</td><td>${r.缓冲笔数}</td><td>${r.切片笔数}</td><td>${r.迟到笔数}</td><td>${ok}</td><td>${潮切.安全文本(r.说明)}</td>`));
        }
      }
      document.getElementById("跑").onclick = async () => {
        const d = await 潮切.postJSON("/api/窗贯验/跑");
        document.getElementById("果").innerHTML = d.是否对齐 ? 潮切.徽章("对齐","好") : 潮切.徽章("撕裂","危");
        await 刷写闸卡(d);
        await 刷();
      };
      刷写闸卡();
      刷();
      </script>

    </main>
  </div>
  <script>
  (async () => {
    try {
      const o = await 潮切.getJSON("/api/概览");
      const r = o.窗规 || {};
      const el = document.getElementById("侧窗号");
      const tm = document.getElementById("侧窗时");
      if (el) el.textContent = r["当前窗号"] || "—";
      if (tm) tm.textContent = `${r["窗起"] || ""} → ${r["窗止"] || ""}`;
    } catch (e) {}
  })();
  </script>
</body>
</html>
